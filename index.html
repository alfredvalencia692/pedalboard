<!DOCTYPE html>
<html lang="tl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedalboard</title>
<style>
:root{color-scheme:dark;--bg:#16130f;--pn:#241f19;--ln:#3a3228;--tx:#f1e9dc;--mu:#988c7b;--ac:#ffb02e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Trebuchet MS",system-ui,sans-serif}
body{max-width:720px;margin:0 auto;padding:12px}
h1{font:700 20px Georgia,serif;margin:0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,select,input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
button:active{background:var(--ln)}
.go{background:var(--ac);color:#1a1205;border:0;font-weight:700}
.go.on{background:#e5484d;color:#fff}
.row{display:flex;gap:6px;overflow-x:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.row>*{flex:none}
.io{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}
.io input[type=range]{padding:0;width:100%}
.bar{height:6px;background:#0d0b08;border-radius:3px;overflow:hidden;grid-column:2/4}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc38a,#ffb02e 75%,#e5484d)}
#msg{color:var(--mu);font-size:12px;margin:0 0 10px}
.tile{width:84px;height:70px;border-radius:10px;border:2px solid var(--ln);padding:6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-weight:700;font-size:12px;background:var(--c)}
.tile.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.tile.off{filter:saturate(.15) brightness(.55)}
.led{width:9px;height:9px;border-radius:50%;background:#333}
.tile:not(.off) .led{background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.add{width:84px;height:70px;border-style:dashed;color:var(--mu)}
#picker{display:none;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:6px 0}
#picker.show{display:grid}
.gh{grid-column:1/-1;flex-basis:100%;font:700 13px Georgia,serif;color:var(--ac);margin-top:8px;text-align:left}
.sel-opts .gh{color:#fff;opacity:.85;margin-top:4px}
#picker button{text-align:left}#picker small{color:var(--mu);font-size:11px}
#ed{border-radius:16px;padding:14px;margin-top:8px;background:var(--c,var(--pn));border:2px solid rgba(0,0,0,.35);box-shadow:inset 0 0 40px rgba(0,0,0,.28)}
#ed h2{margin:0 0 10px;font:700 22px Georgia,serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.knobs{display:flex;flex-wrap:wrap;gap:14px 18px;justify-content:center;padding:6px 0 12px}
.kn{width:76px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize}
.dial{position:relative;width:64px;height:64px;margin:0 auto 4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#151515);border:2px solid #000;box-shadow:0 4px 8px rgba(0,0,0,.5)}
.dial i{position:absolute;left:50%;top:6px;width:4px;height:22px;margin-left:-2px;background:#fff;border-radius:2px;transform-origin:50% 26px}
.kn b{display:block;font-size:12px;color:#fff}
.kn u{text-decoration:none;font-size:11px;color:rgba(255,255,255,.7)}
.sel-opts{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:100%}
.sel-opts button{padding:6px 10px;font-size:12px;background:rgba(0,0,0,.35);border-color:rgba(0,0,0,.5)}
.sel-opts button.on{background:#fff;color:#111}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.foot{width:100px;height:46px;border-radius:23px;font-weight:700;background:#cfcfcf;color:#111;border:3px solid #555}
.foot.off{background:#555;color:#bbb}
.empty{color:var(--mu);text-align:center;padding:20px}
.pre{display:flex;gap:6px;align-items:center}
.pre input{width:120px}
#board{background:linear-gradient(#1d1812,#110e0a);border-radius:14px;padding:12px 10px;border:1px solid var(--ln);box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
.tile{position:relative;width:96px;height:132px;border-radius:12px;border:2px solid rgba(0,0,0,.45);padding:34px 6px 38px;align-items:center;justify-content:center;text-align:center;text-transform:uppercase;letter-spacing:.03em;font-size:11px;line-height:1.15;text-shadow:0 1px 0 rgba(0,0,0,.5);background:linear-gradient(rgba(255,255,255,.16),rgba(0,0,0,.22)),var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.5);touch-action:manipulation}
.tile::before{content:"";position:absolute;top:9px;left:10px;right:10px;height:18px;background:radial-gradient(circle 8px at 16% 50%,#9a9a9a 0 2px,#262626 2.5px 7px,transparent 8px),radial-gradient(circle 8px at 50% 50%,#9a9a9a 0 2px,#262626 2.5px 7px,transparent 8px),radial-gradient(circle 8px at 84% 50%,#9a9a9a 0 2px,#262626 2.5px 7px,transparent 8px)}
.tile::after{content:"";position:absolute;bottom:8px;left:50%;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fafafa,#8b8b8b 60%,#444);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.tile .led{position:absolute;top:31px;right:9px}
.tile.add{background:none;border-style:dashed;text-shadow:none;padding:6px;justify-content:center;box-shadow:none}.tile.add::before,.tile.add::after{display:none}
#ed{position:relative;max-width:380px;margin:12px auto 0;padding:56px 14px 18px;border-radius:18px;border:2px solid rgba(0,0,0,.5);background:radial-gradient(circle at 16px 16px,#ddd 0 3px,#555 4px 6px,transparent 7px),radial-gradient(circle at calc(100% - 16px) 16px,#ddd 0 3px,#555 4px 6px,transparent 7px),radial-gradient(circle at 16px calc(100% - 16px),#ddd 0 3px,#555 4px 6px,transparent 7px),radial-gradient(circle at calc(100% - 16px) calc(100% - 16px),#ddd 0 3px,#555 4px 6px,transparent 7px),linear-gradient(rgba(255,255,255,.18),rgba(0,0,0,.25)),var(--c,var(--pn));box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.55)}
#ed::before{content:"";position:absolute;top:18px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 12px 3px #ff4d4d,inset 0 0 3px #fff}
#ed.offp::before{background:#3a1a1a;box-shadow:none}#ed:has(.empty)::before{display:none}
#ed h2{display:block;text-align:center;margin:0 auto 14px;padding:6px 10px;background:rgba(255,255,255,.93);color:#111;border-radius:6px;font:700 16px Georgia,serif;text-transform:uppercase;letter-spacing:.06em;text-shadow:none;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.kn{width:92px}.dial{width:72px;height:72px;background:radial-gradient(circle,#3c3c3c 0 38%,transparent 39%),repeating-conic-gradient(#4a4a4a 0 5deg,#262626 5deg 10deg);border:3px solid #0d0d0d;box-shadow:0 5px 10px rgba(0,0,0,.6),inset 0 2px 2px rgba(255,255,255,.25)}
.dial i{top:7px;height:22px;transform-origin:50% 26px}
.acts{align-items:center}.acts button:not(.foot){min-width:52px;min-height:48px;background:rgba(0,0,0,.35);border-color:rgba(0,0,0,.5);color:#fff}
.foot{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9a9a9a 55%,#4a4a4a);border:3px solid #222;color:#111;box-shadow:0 6px 10px rgba(0,0,0,.6);font-size:13px}
.foot.off{background:radial-gradient(circle at 35% 30%,#bbb,#666 55%,#333);color:#222}
</style></head>
<body>
<div class="top"><h1>Pedalboard</h1><button id="start" class="go">Start</button><button id="tbtn">Tuner</button><button id="demo">Demo</button><button id="mute" style="background:#7a1d22">Mute</button><button id="tap">Tap</button><input id="bpm" type="number" min="0" max="240" value="120" style="width:68px" title="BPM (0 = walang sync)"><label for="dev" style="color:var(--mu)">Input device:</label><select id="dev" style="max-width:190px"><option>Pindutin muna ang Start</option></select></div>
<div class="io">
<span>In</span><input id="ig" type="range" min="0" max="3" step=".01" value="1"><span id="igv">1.0x</span>
<div class="bar"><i id="mi"></i></div>
<span>Out</span><input id="mg" type="range" min="0" max="1.5" step=".01" value=".5"><span id="mgv">0.5</span>
<div class="bar"><i id="mo"></i></div>
</div>
<p id="msg">Gumamit ng headphones para iwas feedback. I-tap ang Start, tapos payagan ang mic/audio interface.</p>
<div id="tun" class="io" style="display:none;text-align:center;grid-template-columns:1fr"><div id="tn" style="font:700 48px Georgia,serif">--</div><div class="bar" style="grid-column:1;height:12px;position:relative"><i id="tc" style="position:absolute;left:50%;width:6px;background:#ffb02e"></i></div><div id="tf" style="color:var(--mu)">Tumugtog ng isang string (naka-mute ang output)</div></div>
<div class="row" id="presets"></div>
<div class="row" id="board"></div>
<div id="picker"></div>
<div id="ed"></div>
<div class="row pre"><input id="pn" placeholder="Preset name"><button id="save">Save preset</button></div>
<div id="tools"></div>
<div class="row pre"><button id="cpb">+ Create pedal</button><button id="exb">Export</button><button id="imb">Import</button></div>
<div id="cp" class="io" style="display:none;grid-template-columns:1fr"><input id="cn" placeholder="Pangalan ng pedal"><div>Pumili ng hanggang 3 effect. Susunod ang tunog ayon sa bilang.</div><div id="cparts" class="sel-opts" style="justify-content:flex-start"></div><button id="cmk" class="go">Create</button></div>
<textarea id="xt" style="display:none;width:100%;height:90px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:8px"></textarea>
<script>
const $=s=>document.querySelector(s);
const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:0});
const S=(p,v)=>p.setTargetAtTime(v,ctx.currentTime,.015);
const G=(v=1)=>{const g=ctx.createGain();g.gain.value=v;return g};
const F=(t,f,q=.7,g=0)=>{const n=ctx.createBiquadFilter();n.type=t;n.frequency.value=f;n.Q.value=q;n.gain.value=g;return n};
const OS=f=>{const o=ctx.createOscillator();o.frequency.value=f;o.start();return o};
const curve=f=>{const a=new Float32Array(4096);for(let i=0;i<4096;i++)a[i]=f(i/2048-1);return a};
const WS=f=>{const w=ctx.createWaveShaper();w.curve=curve(f);w.oversample='4x';return w};
const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1])};
const mixer=(i,o,wet)=>{const d=G(),w=G();i.connect(d);d.connect(o);wet.connect(w);w.connect(o);return v=>{S(d.gain,Math.cos(v*Math.PI/2));S(w.gain,Math.sin(v*Math.PI/2))}};
const db=v=>(v-.5)*24;

const dist=(f,pg,hpf,cl=0)=>()=>{const i=G(),hp=F('highpass',hpf),pre=G(),ws=WS(f),lp=F('lowpass',4000),o=G();chain(i,hp,pre,ws,lp,o);if(cl){const d=G(cl);i.connect(d);d.connect(o)}
 return{i,o,set(k,v){if(k=='drive')S(pre.gain,1+v*pg);if(k=='tone')S(lp.frequency,800+v*v*7000);if(k=='level')S(o.gain,v*1.2)}}};

const AM=[{g:3,l:1.4,hp:60,vf:600,vg:-4,f:x=>Math.tanh(x*.9)},{g:12,l:.8,hp:100,vf:2500,vg:5,f:x=>Math.tanh(x*2+.1)-Math.tanh(.1)},{g:22,l:.6,hp:110,vf:900,vg:3,f:x=>Math.tanh(x*2.5)},{g:45,l:.5,hp:140,vf:1200,vg:4,f:x=>Math.tanh(x*3+.1)-Math.tanh(.1)},{g:90,l:.38,hp:200,vf:500,vg:-5,f:x=>Math.tanh(x*4+.25)-Math.tanh(.25)},{g:6,l:1.1,hp:70,vf:800,vg:-1,f:x=>Math.tanh(x*1.4)},{g:8,l:1,hp:50,vf:400,vg:2,f:x=>Math.tanh(x*1.6)},{g:35,l:.55,hp:120,vf:700,vg:5,f:x=>Math.tanh(x*2.8+.15)-Math.tanh(.15)},{g:16,l:.75,hp:100,vf:1000,vg:4,f:x=>Math.tanh(x*2.2+.05)-Math.tanh(.05)},{g:70,l:.42,hp:160,vf:1100,vg:4,f:x=>Math.tanh(x*3.5+.2)-Math.tanh(.2)},{g:80,l:.4,hp:170,vf:1500,vg:3,f:x=>Math.tanh(x*3.8+.1)-Math.tanh(.1)},{g:60,l:.45,hp:150,vf:650,vg:-3,f:x=>Math.tanh(x*3.2+.2)-Math.tanh(.2)},{g:120,l:.32,hp:220,vf:450,vg:-3,f:x=>Math.tanh(x*5+.3)-Math.tanh(.3)}];
const CB=[{lp:5600,lo:1,pk:3000,pg:2},{lp:5200,lo:2,pk:2200,pg:5},{lp:4400,lo:4,pk:2000,pg:3},{lp:4800,lo:3,pk:3500,pg:4},{lp:5400,lo:1,pk:2800,pg:2},{lp:4600,lo:3,pk:1500,pg:3},{lp:4300,lo:5,pk:1800,pg:2},{lp:6000,lo:0,pk:4000,pg:3},{lp:4200,lo:4,pk:2400,pg:5},{lp:4600,lo:2,pk:3200,pg:4}];

const SPEC={
 od:{n:'Overdrive',c:'#2f8f4e',P:[['drive','Drive',.5],['tone','Tone',.5],['level','Level',.5]],mk:dist(x=>Math.tanh(x*2),30,300)},
 ds:{n:'Distortion',c:'#c8581a',P:[['drive','Gain',.6],['tone','Tone',.5],['level','Level',.4]],mk:dist(x=>Math.max(-1,Math.min(1,x*3)),90,150)},
 fz:{n:'Fuzz',c:'#7b3fa0',P:[['drive','Sustain',.7],['tone','Tone',.5],['level','Level',.4]],mk:dist(x=>{x*=5;return x>0?1-Math.exp(-x):-(1-Math.exp(x*.6))*.8},100,100)},
 cp:{n:'Compressor',c:'#2a6fb5',P:[['th','Sustain',.5],['lv','Level',.5]],mk(){const i=G(),c=ctx.createDynamicsCompressor(),o=G();chain(i,c,o);
  return{i,o,set(k,v){if(k=='th'){S(c.threshold,-5-v*45);c.ratio.value=2+v*14}if(k=='lv')S(o.gain,v*2)}}}},
 wh:{n:'Wah',c:'#a8323e',P:[['pos','Pedal',.5],['q','Q',.5],['rate','Auto rate',0],['dep','Auto depth',.6]],mk(){const i=G(),bp=F('bandpass',800,5),o=G(2.5),l=OS(1),lg=G(0),st={pos:.5,q:.5,rate:0,dep:.6};l.connect(lg);lg.connect(bp.frequency);chain(i,bp,o);
  return{i,o,set(k,v){st[k]=v;S(bp.frequency,350*Math.pow(6,st.pos));bp.Q.value=2+st.q*10;S(l.frequency,.5+st.rate*8);S(lg.gain,st.rate>.02?st.dep*900:0)}}}},
 ch:{n:'Chorus',c:'#1f9bb0',P:[['rate','Rate',.3],['dep','Depth',.5],['mix','Mix',.5]],mk(){const i=G(),o=G(),d=ctx.createDelay(.1),l=OS(1),lg=G(0);d.delayTime.value=.025;l.connect(lg);lg.connect(d.delayTime);i.connect(d);const m=mixer(i,o,d);
  return{i,o,set(k,v){if(k=='rate')S(l.frequency,.1+v*6);if(k=='dep')S(lg.gain,v*.01);if(k=='mix')m(v)}}}},
 ph:{n:'Phaser',c:'#d6891b',P:[['rate','Rate',.3],['dep','Depth',.6],['mix','Mix',.5]],mk(){const i=G(),o=G(),l=OS(1),lg=G(0),a=[1,2,3,4].map(()=>F('allpass',800,.7));l.connect(lg);a.forEach(x=>lg.connect(x.frequency));chain(i,...a);const m=mixer(i,o,a[3]);
  return{i,o,set(k,v){if(k=='rate')S(l.frequency,.1+v*6);if(k=='dep')S(lg.gain,200+v*1800);if(k=='mix')m(v)}}}},
 tr:{n:'Tremolo',c:'#4b5d67',P:[['rate','Speed',.4],['dep','Depth',.6]],mk(){const i=G(),o=G(),t=G(.7),l=OS(5),lg=G(.3);l.connect(lg);lg.connect(t.gain);chain(i,t,o);
  return{i,o,set(k,v){if(k=='rate')S(l.frequency,.5+v*14);if(k=='dep'){S(t.gain,1-v/2);S(lg.gain,v/2)}}}}},
 dl:{n:'Delay',c:'#3a4fbf',P:[['time','Time',.35],['fb','Repeats',.4],['mix','Mix',.3]],mk(){const i=G(),o=G(),d=ctx.createDelay(1.5),fb=G(.4);chain(i,d);d.connect(fb);fb.connect(d);const m=mixer(i,o,d);
  return{i,o,set(k,v){if(k=='time')S(d.delayTime,.05+v*.95);if(k=='fb')S(fb.gain,v*.9);if(k=='mix')m(v)}}}},
 rv:{n:'Reverb',c:'#2c7a73',P:[['decay','Decay',.4],['tone','Tone',.5],['mix','Mix',.25]],mk(){const i=G(),o=G(),cv=ctx.createConvolver(),lp=F('lowpass',5000);chain(i,cv,lp);const m=mixer(i,o,lp);
  const ir=s=>{const n=Math.floor(ctx.sampleRate*s),b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let j=0;j<n;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/n,2.5)}cv.buffer=b};
  return{i,o,set(k,v){if(k=='decay')ir(.3+v*3.5);if(k=='tone')S(lp.frequency,1500+v*8000);if(k=='mix')m(v)}}}},
 ts:{n:'Screamer (TS style)',c:'#3fa34d',P:[['drive','Drive',.4],['tone','Tone',.5],['level','Level',.6]],mk:dist(x=>Math.tanh(x*1.3),25,700,.45)},
 rt:{n:'Rodent (RAT style)',c:'#26262b',P:[['drive','Distortion',.6],['tone','Filter',.5],['level','Volume',.4]],mk:dist(x=>Math.max(-1,Math.min(1,x*4)),100,200)},
 bm:{n:'Sustainer (Muff style)',c:'#7a6a50',P:[['drive','Sustain',.7],['tone','Tone',.4],['level','Volume',.4]],mk:dist(x=>Math.tanh(3*Math.tanh(x*4)),120,80)},
 ad:{n:'Analog Delay (DM style)',c:'#5a3d8f',P:[['time','Time',.35],['fb','Repeats',.4],['mix','Mix',.3]],mk(){const i=G(),o=G(),d=ctx.createDelay(1.5),fb=G(.4),lp=F('lowpass',2200);chain(i,d,lp,fb);fb.connect(d);const m=mixer(i,o,lp);
  return{i,o,set(k,v){if(k=='time')S(d.delayTime,.05+v*.95);if(k=='fb')S(fb.gain,v*.9);if(k=='mix')m(v)}}}},
 ng:{n:'Noise Gate',c:'#444b52',P:[['th','Threshold',.3],['rel','Release',.4]],mk(){const i=G(),o=G(),sp=ctx.createScriptProcessor(256,1,1),st={th:.006,rel:.4};let env=0,g=0;
  sp.onaudioprocess=e=>{const a=e.inputBuffer.getChannelData(0),b=e.outputBuffer.getChannelData(0),rc=Math.exp(-1/(ctx.sampleRate*(.03+st.rel*.3))),dn=.0004+.004*(1-st.rel);for(let n=0;n<a.length;n++){const x=Math.abs(a[n]);env=x>env?x:env*rc;const t=env>st.th?1:0;g+=(t-g)*(t>g?.05:dn);b[n]=a[n]*g}};chain(i,sp,o);
  return{i,o,set(k,v){if(k=='th')st.th=.0005+v*v*.06;if(k=='rel')st.rel=v}}}},
 bo:{n:'Clean Boost',c:'#6f7a85',P:[['lv','Boost',.5]],mk(){const i=G(),o=G();i.connect(o);return{i,o,set(k,v){S(o.gain,v*4)}}}},
 kl:{n:'Centaur (Klon style)',c:'#b8962e',P:[['drive','Gain',.35],['tone','Treble',.5],['level','Output',.6]],mk:dist(x=>Math.tanh(x*1.1),20,400,.6)},
 sd:{n:'Super OD (SD style)',c:'#a8891c',P:[['drive','Drive',.4],['tone','Tone',.5],['level','Level',.5]],mk:dist(x=>x>0?Math.tanh(x*1.6):Math.tanh(x*1.1),30,500,.3)},
 bd:{n:'Blues Driver (BD style)',c:'#2b6cb0',P:[['drive','Gain',.4],['tone','Tone',.5],['level','Level',.5]],mk:dist(x=>Math.tanh(x*1.8+.1)-Math.tanh(.1),40,200,.2)},
 mx:{n:'Dist+ (MXR style)',c:'#b39b12',P:[['drive','Distortion',.5],['tone','Tone',.5],['level','Output',.5]],mk:dist(x=>x>0?Math.min(x*3,1):Math.max(x*3,-.75),70,160)},
 d1:{n:'DS-1 style',c:'#e8741a',P:[['drive','Dist',.5],['tone','Tone',.5],['level','Level',.4]],mk:dist(x=>Math.tanh(x*3.5),80,180)},
 mz:{n:'Metal Zone (MT style)',c:'#3a3a3a',P:[['drive','Dist',.7],['tone','Tone',.5],['level','Level',.4]],mk:dist(x=>Math.tanh(x*8),150,250)},
 tb:{n:'Tone Bender style',c:'#8c7550',P:[['drive','Attack',.7],['tone','Tone',.5],['level','Level',.4]],mk:dist(x=>{x*=7;return x>0?Math.tanh(x):Math.tanh(x*.5)*.9},110,150)},
 fl:{n:'Flanger',c:'#2d8fae',P:[['rate','Rate',.3],['dep','Depth',.6],['fb','Regen',.5],['mix','Mix',.5]],mk(){const i=G(),o=G(),d=ctx.createDelay(.05),fb=G(.5),l=OS(.3),lg=G(.002);d.delayTime.value=.004;l.connect(lg);lg.connect(d.delayTime);chain(i,d);d.connect(fb);fb.connect(d);const m=mixer(i,o,d);
